        // 187
        { id: 187, pregunta: "¿Cuál es la acción correcta del conductor, según las normas de tránsito, en la situación que plantea el siguiente gráfico?", opciones: { a: "Gitar rápidamente a la derecha antes que el peatón cruce la calzada.", b: "Dar preferencia de paso al peatón para que cruce la calzada.", c: "Gitar lentamente a la derecha antes que el peatón cruce la calzada.", d: "Tocar el claxon para que el peatón no cruce la calzada" }, respuesta: "b", argumento: "El peatón tiene prioridad en el paso peatonal, se debe detener y ceder el paso." },
        // 188
        { id: 188, pregunta: "¿En cuál de las siguientes opciones, los factores mencionados contribuyen a una colisión vehicular?", opciones: { a: "Pavimento seco, somnolencia, frenos desgastados.", b: "Pavimento húmedo, neumáticos desgastados, cansancio.", c: "Reductores de velocidad, falta de atención, uso del teléfono celular.", d: "Ninguna de las alternativas es correcta." }, respuesta: "b", argumento: "Pavimento húmedo, neumáticos desgastados y cansancio son factores de riesgo de colisión." },
        // 189
        { id: 189, pregunta: "La  es la parte de una carretera o camino contigua a la calzada, no habilitada para la circulación de vehículos y destinada eventualmente a la detención de vehículos en emergencia y circulación de peatones.", opciones: { a: "Berma.", b: "Autopista.", c: "Acera.", d: "Demarcación." }, respuesta: "a", argumento: "La berma es el borde de la calzada para detenciones de emergencia y peatones." },
        // 190
        { id: 190, pregunta: "Es una parte de la vía destinada a la circulación de vehículos y eventualmente al cruce de peatones y animales.", opciones: { a: "La calzada.", b: "La acera.", c: "La berma.", d: "Ninguna de las alternativas es correcta." }, respuesta: "a", argumento: "La calzada es la parte de la vía por donde circulan vehículos." },
        // 191
        { id: 191, pregunta: "Es una parte de la vía destinada al uso de peatones", opciones: { a: "La acera.", b: "La calzada.", c: "La berma.", d: "La autopista." }, respuesta: "a", argumento: "La acera es exclusiva para peatones." },
        // 192
        { id: 192, pregunta: "Son señales que regulan el tránsito:", opciones: { a: "Las bocinas y las marcas en la calzada o señales horizontales.", b: "Las bocinas y las señales verticales.", c: "Las señales verticales, las marcas en la calzada o señales horizontales y las bocinas.", d: "Las señales verticales y las marcas en la calzada o señales horizontales." }, respuesta: "d", argumento: "Las señales de tránsito son verticales y horizontales (marcas en el pavimento). Las bocinas no son señales de regulación." },
        // 193
        { id: 193, pregunta: "Los vehículos deben ser conducidos con:", opciones: { a: "Puertas y capot cerrados, permitiéndose la maletera entreabierta para casos especiales.", b: "Puertas, capot y maletera cerrados.", c: "Puertas, capot y maletera cerrados, salvo autorización especial.", d: "Capot y maletera cerrados, permitiéndose dos puertas entreabiertas para casos especiales." }, respuesta: "b", argumento: "Se debe conducir con puertas, capot y maletera cerrados." },
        // 194
        { id: 194, pregunta: "El conductor que en una vía urbana va a girar a la izquierda, a la derecha o en 'U' debe hacer la señal respectiva con la luz direccional, por lo menos:", opciones: { a: "2 segundos antes de realizar la maniobra.", b: "1 metro antes de realizar la maniobra.", c: "20 metros antes de realizar la maniobra.", d: "3 metros antes de realizar la maniobra." }, respuesta: "c", argumento: "En zona urbana, se debe señalizar al menos 20 metros antes de la maniobra." },
        // 195
        { id: 195, pregunta: "Si usted está conduciendo por una carretera y va girar a la izquierda, debe realizar la señal respectiva con la luz direccional por lo menos:", opciones: { a: "2 segundos antes de realizar la maniobra.", b: "2 metros antes de realizar la maniobra.", c: "30 metros antes de realizar la maniobra.", d: "1 metro antes de realizar la maniobra." }, respuesta: "c", argumento: "En carretera, se debe señalizar al menos 30 metros antes del giro." },
        // 196
        { id: 196, pregunta: "La licencia particular de la Clase y Categoría A-I, permite conducir motos?", opciones: { a: "Si.", b: "No.", c: "Únicamente en el ámbito urbano.", d: "Únicamente en carreteras." }, respuesta: "b", argumento: "La licencia A-I es para automóviles, no para motocicletas (se necesita categoría A-II)." },
        // 197
        { id: 197, pregunta: "El siguiente gráfico muestra:", opciones: { a: "Señalización de tránsito vertical y horizontal en una zona escolar.", b: "Únicamente señalización de tránsito vertical en una zona escolar.", c: "Únicamente señalización de tránsito horizontal en una zona escolar.", d: "Ninguna de las alternativas es correcta." }, respuesta: "a", argumento: "El gráfico muestra ambas señalizaciones vertical y horizontal en zona escolar." },
        // 198
        { id: 198, pregunta: "Las  canalizadoras, tiene por función conformar las islas canalizadoras del tránsito automotor en una .", opciones: { a: "Islas canalizadoras - vía.", b: "Líneas - intersección.", c: "Vías - intersección.", d: "Todas las alternativas son correctas." }, respuesta: "b", argumento: "Las líneas canalizadoras (marcas en el pavimento) forman islas en intersecciones." },
        // 199
        { id: 199, pregunta: "Si al conducir en una intersección se encuentra con las siguientes marcas en el pavimento (malla ortogonal de color amarillo), significa:", opciones: { a: "Que no puede detener el vehículo dentro del área de intersección.", b: "Que se están relizando trabajos de emergencia en el área demarcada.", c: "Que únicamente puede detener el vehículo dentro del área de intersección.", d: "Que es una isla de refugio peatonal." }, respuesta: "a", argumento: "La malla amarilla indica zona de 'no bloqueo' de intersección; no se debe detener el vehículo allí." },
        // 200
        { id: 200, pregunta: "De acuerdo al siguienteí grafico, es correcto afirmar que:", opciones: { a: "La zona que permite adelantar inicia con las líneas amarillas continuas.", b: "Los conductores pueden estacionarse al empezar las líneas continuas.", c: "La zona de no adelantar inicia con las líneas amarillas contínuas.", d: "Ninguna de las alternativas es correcta." }, respuesta: "c", argumento: "Las líneas amarillas continuas indican zona donde no se puede adelantar." }
    ];

    // ============================================================
    //  LÓGICA DE LA APLICACIÓN
    // ============================================================
    const total = preguntas.length;
    let preguntasDisponibles = [...preguntas];
    let preguntaActual = null;
    let respuestaSeleccionada = null;
    let respondido = false;

    const $ = id => document.getElementById(id);
    const textoPregunta = $('preguntaTexto');
    const opcionesContainer = $('opcionesContainer');
    const feedback = $('feedback');
    const feedbackTitulo = $('feedbackTitulo');
    const feedbackArgumento = $('feedbackArgumento');
    const btnSiguiente = $('btnSiguiente');
    const btnMostrarTodas = $('btnMostrarTodas');
    const btnOcultarTodas = $('btnOcultarTodas');
    const modoVisualizacion = $('modoVisualizacion');
    const listaVisualizacion = $('listaVisualizacion');
    const progresoBar = $('progresoBar');
    const preguntaNumero = $('preguntaNumero');
    const estadoRespuesta = $('estadoRespuesta');

    function cargarPreguntaAleatoria() {
        if (preguntasDisponibles.length === 0) {
            preguntasDisponibles = [...preguntas];
        }
        const idx = Math.floor(Math.random() * preguntasDisponibles.length);
        const p = preguntasDisponibles.splice(idx, 1)[0];
        preguntaActual = p;
        respuestaSeleccionada = null;
        respondido = false;

        textoPregunta.textContent = p.pregunta;
        const letras = ['a', 'b', 'c', 'd'];
        opcionesContainer.innerHTML = '';
        letras.forEach(letra => {
            const div = document.createElement('div');
            div.className = 'opcion';
            div.dataset.letra = letra;
            div.innerHTML = `<span class="letra">${letra.toUpperCase()}</span> ${p.opciones[letra]}`;
            div.setAttribute('tabindex', '0');
            div.addEventListener('click', () => seleccionarOpcion(letra));
            div.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    seleccionarOpcion(letra);
                }
            });
            opcionesContainer.appendChild(div);
        });

        // Resetear feedback
        feedback.className = 'feedback';
        feedback.style.display = 'none';
        btnSiguiente.disabled = true;
        estadoRespuesta.textContent = '⏳ Sin responder';

        // Actualizar número y progreso
        const respondidas = total - preguntasDisponibles.length;
        preguntaNumero.textContent = `Pregunta ${respondidas} de ${total}`;
        const porcentaje = (respondidas / total) * 100;
        progresoBar.style.width = `${porcentaje}%`;

        // Enfocar primera opción
        const primera = opcionesContainer.querySelector('.opcion');
        if (primera) primera.focus();
    }

    function seleccionarOpcion(letra) {
        if (respondido) return;
        respuestaSeleccionada = letra;
        const esCorrecta = (letra === preguntaActual.respuesta);
        respondido = true;

        // Marcar opciones
        const opciones = opcionesContainer.querySelectorAll('.opcion');
        opciones.forEach(el => {
            el.classList.add('deshabilitada');
            const l = el.dataset.letra;
            if (l === preguntaActual.respuesta) {
                el.classList.add('correcta');
            } else if (l === letra && !esCorrecta) {
                el.classList.add('incorrecta');
            }
        });

        // Mostrar feedback
        feedback.style.display = 'block';
        if (esCorrecta) {
            feedback.className = 'feedback correcto';
            feedbackTitulo.textContent = '✅ ¡Correcto!';
            estadoRespuesta.textContent = '✅ Correcta';
        } else {
            feedback.className = 'feedback incorrecto';
            feedbackTitulo.textContent = '❌ Incorrecto';
            estadoRespuesta.textContent = '❌ Incorrecta';
        }
        feedbackArgumento.textContent = preguntaActual.argumento;

        btnSiguiente.disabled = false;
        btnSiguiente.focus();
    }

    function siguientePregunta() {
        if (preguntasDisponibles.length === 0 && preguntaActual) {
            // Ya se respondieron todas, reiniciar?
            preguntasDisponibles = [...preguntas];
        }
        cargarPreguntaAleatoria();
    }

    // Mostrar todas las preguntas (modo visualización)
    function mostrarTodas() {
        modoVisualizacion.classList.remove('oculto');
        // Ocultar la pregunta actual
        document.getElementById('preguntaContainer').style.display = 'none';
        document.querySelector('.pregunta-header').style.display = 'none';
        feedback.style.display = 'none';
        btnSiguiente.style.display = 'none';
        btnMostrarTodas.style.display = 'none';

        let html = '';
        preguntas.forEach(p => {
            const resp = p.respuesta;
            const opcionesStr = Object.keys(p.opciones).map(l => `${l.toUpperCase()}) ${p.opciones[l]}`).join(' | ');
            html += `
                <div class="vis-item">
                    <div class="v-preg">${p.id}. ${p.pregunta}</div>
                    <div class="v-resp"><strong>Opciones:</strong> ${opcionesStr}</div>
                    <div class="v-resp"><span class="v-letra">Respuesta correcta: ${resp.toUpperCase()}</span></div>
                    <div class="v-arg">💡 ${p.argumento}</div>
                </div>
            `;
        });
        listaVisualizacion.innerHTML = html;
        // Desplazarse al inicio del modo visualización
        modoVisualizacion.scrollIntoView({ behavior: 'smooth' });
    }

    function ocultarTodas() {
        modoVisualizacion.classList.add('oculto');
        document.getElementById('preguntaContainer').style.display = 'block';
        document.querySelector('.pregunta-header').style.display = 'flex';
        btnSiguiente.style.display = 'inline-flex';
        btnMostrarTodas.style.display = 'inline-flex';
        // Recargar pregunta
        cargarPreguntaAleatoria();
    }

    // Eventos
    btnSiguiente.addEventListener('click', siguientePregunta);
    btnMostrarTodas.addEventListener('click', mostrarTodas);
    btnOcultarTodas.addEventListener('click', ocultarTodas);

    // Atajo de teclado: Tab para opciones, Enter para seleccionar, y Siguiente con Enter cuando está habilitado.
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            if (!btnSiguiente.disabled && document.activeElement === btnSiguiente) {
                siguientePregunta();
                e.preventDefault();
            }
            // Si se está en una opción y no respondido, el click ya maneja Enter.
        }
    });

    // Contador de visitas con countapi.xyz
    function actualizarVisitas() {
        const key = 'examen-manejo-a1';
        const url = `https://api.countapi.xyz/hit/${key}`;
        fetch(url)
            .then(res => res.json())
            .then(data => {
                document.getElementById('visitasContador').textContent = data.value || 0;
            })
            .catch(() => {
                // fallback: contador local (incrementa cada vez que se carga la página)
                let local = localStorage.getItem('visitasExamen') || 0;
                local = parseInt(local) + 1;
                localStorage.setItem('visitasExamen', local);
                document.getElementById('visitasContador').textContent = local;
            });
    }
    actualizarVisitas();

    // Iniciar
    cargarPreguntaAleatoria();
</script>
